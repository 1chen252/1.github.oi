<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维导图式知识点展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 主容器 - 相对定位 */
        .mindmap-container {
            position: relative;
            width: 800px;
            height: 600px;
        }
        
        /* 中心图标 - 相对定位 */
        .center-node {
            position: relative; /* 相对定位 */
            width: 150px;
            height: 150px;
            margin: 0 auto;
            top: 50%; /* 垂直居中 */
            transform: translateY(-50%); /* 精确居中 */
            background-color: #3498db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 10; /* 确保在最上层 */
            border: 4px solid white;
        }
        
        /* 知识点框 - 绝对定位 */
        .knowledge-node {
            position: absolute;
            width: 220px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 5;
        }
        
        /* 调整三个知识点的位置，确保不遮挡中心图标 */
        .node-1 {
            top: 20%;
            left: 10%;
        }
        
        .node-2 {
            top: 20%;
            right: 10%;
        }
        
        .node-3 {
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 知识点内容样式 */
        .knowledge-node h3 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .knowledge-node ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .knowledge-node li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
            line-height: 1.4;
        }
        
        .knowledge-node li:before {
            content: "•";
            color: #3498db;
            position: absolute;
            left: 0;
            font-size: 18px;
        }
        
        /* 悬停效果 */
        .knowledge-node:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 15;
        }
        
        .node-1:hover, .node-3:hover {
            transform: translateY(-5px) scale(1.05);
        }
        
        .node-2:hover {
            transform: translateY(-5px) scale(1.05);
        }
    </style>
</head>
<body>
    <div class="mindmap-container">
        <!-- 中心节点 - 相对定位 -->
        <div class="center-node">
            前端核心
        </div>
        
        <!-- 知识点节点 - 绝对定位 -->
        <div class="knowledge-node node-1">
            <h3>HTML5</h3>
            <ul>
                <li>语义化标签</li>
                <li>表单增强</li>
                <li>多媒体支持</li>
                <li>Canvas/WebGL</li>
                <li>本地存储API</li>
            </ul>
        </div>
        
        <div class="knowledge-node node-2">
            <h3>CSS3</h3>
            <ul>
                <li>Flex/Grid布局</li>
                <li>过渡与动画</li>
                <li>变形与转换</li>
                <li>变量与函数</li>
                <li>媒体查询</li>
            </ul>
        </div>
        
        <div class="knowledge-node node-3">
            <h3>JavaScript</h3>
            <ul>
                <li>DOM/BOM操作</li>
                <li>事件机制</li>
                <li>异步编程</li>
                <li>ES6+新特性</li>
                <li>设计模式</li>
            </ul>
        </div>
    </div>
</body>
</html>
